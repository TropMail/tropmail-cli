name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      - name: Check formatting
        if: runner.os == 'Linux'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed on: $unformatted"
            exit 1
          fi
      - name: Refuse a local replace of tropmail-go
        if: runner.os == 'Linux'
        run: |
          if grep -qE '^replace .* => \.\.' go.mod; then
            echo "::error file=go.mod::Remove the relative replace and pin a released tropmail-go version before pushing this repo."
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o tropmail .
      - name: Smoke test the binary
        if: runner.os != 'Windows'
        run: ./tropmail version && ./tropmail --help > /dev/null
