name: Release

# Tag v1.2.3 on this repo. GoReleaser builds binaries, a GitHub Release,
# ghcr.io/tropmail/tropmail, and the Homebrew cask in tropmail/homebrew-tap.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      snapshot:
        description: Build a snapshot without publishing
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      - name: Refuse a local replace of tropmail-go
        run: |
          if grep -qE '^replace .* => \.\.' go.mod; then
            echo "::error file=go.mod::Publish tropmail-go first, then pin it and drop the relative replace."
            exit 1
          fi
      - run: go vet ./...
      - run: go test -race ./...

  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: go.sum
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: '~> v2'
          args: >-
            release --clean
            ${{ (github.event_name == 'workflow_dispatch' && inputs.snapshot)
                && '--snapshot --skip=publish' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-dist
          path: dist/*.tar.gz
          if-no-files-found: ignore
